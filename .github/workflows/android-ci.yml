name: Nabdh Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_test_lint_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-extract nabdh-android.zip
        run: |
          if [ -f "nabdh-android.zip" ] && [ ! -f "settings.gradle.kts" ]; then
            unzip -o nabdh-android.zip -d .
            if [ -d "nabdh-android" ]; then
              cp -r nabdh-android/. .
              rm -rf nabdh-android
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.NABDH_KEYSTORE_BASE64 != '' }}
        env:
          NABDH_KEYSTORE_BASE64: ${{ secrets.NABDH_KEYSTORE_BASE64 }}
        run: |
          echo "$NABDH_KEYSTORE_BASE64" | base64 --decode > app/nabdh-release.jks

      - name: Assemble Debug, Unit Tests & Lint
        run: gradle assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Assemble Release
        env:
          NABDH_KEYSTORE_PASSWORD: ${{ secrets.NABDH_KEYSTORE_PASSWORD }}
          NABDH_KEY_ALIAS: ${{ secrets.NABDH_KEY_ALIAS }}
          NABDH_KEY_PASSWORD: ${{ secrets.NABDH_KEY_PASSWORD }}
        run: |
          if [ -f "app/nabdh-release.jks" ]; then
            export NABDH_KEYSTORE_PATH="nabdh-release.jks"
          fi
          gradle assembleRelease --stacktrace

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: nabdh-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/lint-results-debug.html
